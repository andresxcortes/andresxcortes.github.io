<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 448" role="img" aria-label="Lab harness: models swap freely while the sandbox and the finding record stay fixed" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Lab harness: models swap freely while the sandbox and the finding record stay fixed</title><rect width="760" height="448" rx="12" fill="#060606"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6b6b6b"/></marker></defs><text x="24" y="34" font-size="15" font-weight="600" fill="#f5f5f5">Models swap freely; the sandbox and the finding record stay fixed</text><g fill="none" stroke="#6b6b6b" stroke-width="1.25"><path d="M224 100H280" marker-end="url(#a)"/><path d="M480 100H536" marker-start="url(#a)" marker-end="url(#a)"/><path d="M124 176V156H340V136" marker-end="url(#a)"/><path d="M380 136V176" marker-end="url(#a)"/><path d="M380 296V328" marker-end="url(#a)"/><path d="M480 364H536" marker-end="url(#a)"/><path d="M124 400V420H636V400" marker-end="url(#a)"/></g><rect x="24" y="64" width="200" height="72" rx="8" fill="#0f0f0f" stroke="#3a3a3a" stroke-width="1.25"/><text x="124.0" y="88" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5">Playbooks</text><text x="124.0" y="106" text-anchor="middle" font-size="11.5" fill="#9e9e9e">YAML, versioned,</text><text x="124.0" y="122" text-anchor="middle" font-size="11.5" fill="#9e9e9e">with a spending cap per run</text><rect x="280" y="64" width="200" height="72" rx="8" fill="#0f0f0f" stroke="#3a3a3a" stroke-width="1.25"/><text x="380.0" y="88" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5">Runner</text><text x="380.0" y="106" text-anchor="middle" font-size="11.5" fill="#9e9e9e">Inspect, a coding agent,</text><text x="380.0" y="122" text-anchor="middle" font-size="11.5" fill="#9e9e9e">or a thin playbook runner</text><rect x="536" y="64" width="200" height="72" rx="8" fill="#0f0f0f" stroke="#3a3a3a" stroke-width="1.25"/><text x="636.0" y="88" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5">Model gateway</text><text x="636.0" y="106" text-anchor="middle" font-size="11.5" fill="#9e9e9e">pinned, lab-only keys</text><text x="636.0" y="122" text-anchor="middle" font-size="11.5" fill="#9e9e9e">5 models from 4 vendors</text><rect x="24" y="176" width="200" height="72" rx="8" fill="#0f0f0f" stroke="#3a3a3a" stroke-width="1.25"/><text x="124.0" y="200" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5">Advisory feeds</text><text x="124.0" y="218" text-anchor="middle" font-size="11.5" fill="#9e9e9e">CISA KEV, OSV, GitHub</text><text x="124.0" y="234" text-anchor="middle" font-size="11.5" fill="#9e9e9e">advisories, read only</text><rect x="280" y="176" width="456" height="120" rx="8" fill="#161616" stroke="#3a3a3a" stroke-width="1.25"/><text x="296" y="197" font-size="13" font-weight="600" fill="#f5f5f5">Sandbox: isolated, no internet</text><text x="720" y="197" text-anchor="end" font-size="11.5" fill="#9e9e9e">rebuilt per experiment</text><rect x="296" y="208" width="208" height="72" rx="8" fill="#0f0f0f" stroke="#3a3a3a" stroke-width="1.25"/><text x="400.0" y="232" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5">Tools</text><text x="400.0" y="250" text-anchor="middle" font-size="11.5" fill="#9e9e9e">Semgrep, gitleaks, OSV,</text><text x="400.0" y="266" text-anchor="middle" font-size="11.5" fill="#9e9e9e">Nuclei, ZAP, a browser</text><rect x="520" y="208" width="200" height="72" rx="8" fill="#0f0f0f" stroke="#3a3a3a" stroke-width="1.25"/><text x="620.0" y="232" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5">Targets</text><text x="620.0" y="250" text-anchor="middle" font-size="11.5" fill="#9e9e9e">lab apps and public</text><text x="620.0" y="266" text-anchor="middle" font-size="11.5" fill="#9e9e9e">benchmarks only</text><rect x="24" y="328" width="200" height="72" rx="8" fill="#0f0f0f" stroke="#3a3a3a" stroke-width="1.25"/><text x="124.0" y="352" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5">Answer keys</text><text x="124.0" y="370" text-anchor="middle" font-size="11.5" fill="#9e9e9e">written before each run,</text><text x="124.0" y="386" text-anchor="middle" font-size="11.5" fill="#9e9e9e">two apps kept hidden</text><rect x="280" y="328" width="200" height="72" rx="8" fill="#122032" stroke="#4c9fff" stroke-width="2"/><text x="380.0" y="352" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5">Finding records</text><text x="380.0" y="370" text-anchor="middle" font-size="11.5" fill="#f5f5f5">CWE, ATT&amp;CK, evidence</text><text x="380.0" y="386" text-anchor="middle" font-size="11.5" fill="#f5f5f5">and a safe proof</text><rect x="536" y="328" width="200" height="72" rx="8" fill="#0f0f0f" stroke="#3a3a3a" stroke-width="1.25"/><text x="636.0" y="352" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5">Scorer and reviewer</text><text x="636.0" y="370" text-anchor="middle" font-size="11.5" fill="#9e9e9e">answer key, then a second</text><text x="636.0" y="386" text-anchor="middle" font-size="11.5" fill="#9e9e9e">vendor, then a person</text><text x="388" y="164" font-size="11.5" fill="#9e9e9e">tool calls</text><text x="388" y="316" font-size="11.5" fill="#9e9e9e">evidence</text></svg>