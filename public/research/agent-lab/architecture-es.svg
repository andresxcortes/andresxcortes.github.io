<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 448" role="img" aria-label="Arnés del laboratorio: los modelos se cambian, el sandbox y el registro de hallazgos quedan fijos" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Arnés del laboratorio: los modelos se cambian, el sandbox y el registro de hallazgos quedan fijos</title><rect width="760" height="448" rx="12" fill="#060606"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6b6b6b"/></marker></defs><text x="24" y="34" font-size="15" font-weight="600" fill="#f5f5f5">Los modelos se cambian; el sandbox y el registro de hallazgos quedan fijos</text><g fill="none" stroke="#6b6b6b" stroke-width="1.25"><path d="M224 100H280" marker-end="url(#a)"/><path d="M480 100H536" marker-start="url(#a)" marker-end="url(#a)"/><path d="M124 176V156H340V136" marker-end="url(#a)"/><path d="M380 136V176" marker-end="url(#a)"/><path d="M380 296V328" marker-end="url(#a)"/><path d="M480 364H536" marker-end="url(#a)"/><path d="M124 400V420H636V400" marker-end="url(#a)"/></g><rect x="24" y="64" width="200" height="72" rx="8" fill="#0f0f0f" stroke="#3a3a3a" stroke-width="1.25"/><text x="124.0" y="88" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5">Playbooks</text><text x="124.0" y="106" text-anchor="middle" font-size="11.5" fill="#9e9e9e">YAML versionado,</text><text x="124.0" y="122" text-anchor="middle" font-size="11.5" fill="#9e9e9e">tope de gasto por corrida</text><rect x="280" y="64" width="200" height="72" rx="8" fill="#0f0f0f" stroke="#3a3a3a" stroke-width="1.25"/><text x="380.0" y="88" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5">Runner</text><text x="380.0" y="106" text-anchor="middle" font-size="11.5" fill="#9e9e9e">Inspect, un agente general</text><text x="380.0" y="122" text-anchor="middle" font-size="11.5" fill="#9e9e9e">o un runner propio mínimo</text><rect x="536" y="64" width="200" height="72" rx="8" fill="#0f0f0f" stroke="#3a3a3a" stroke-width="1.25"/><text x="636.0" y="88" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5">Gateway de modelos</text><text x="636.0" y="106" text-anchor="middle" font-size="11.5" fill="#9e9e9e">versión fija, claves propias</text><text x="636.0" y="122" text-anchor="middle" font-size="11.5" fill="#9e9e9e">5 modelos, 4 proveedores</text><rect x="24" y="176" width="200" height="72" rx="8" fill="#0f0f0f" stroke="#3a3a3a" stroke-width="1.25"/><text x="124.0" y="200" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5">Avisos públicos</text><text x="124.0" y="218" text-anchor="middle" font-size="11.5" fill="#9e9e9e">CISA KEV, OSV, GitHub</text><text x="124.0" y="234" text-anchor="middle" font-size="11.5" fill="#9e9e9e">Advisories, solo lectura</text><rect x="280" y="176" width="456" height="120" rx="8" fill="#161616" stroke="#3a3a3a" stroke-width="1.25"/><text x="296" y="197" font-size="13" font-weight="600" fill="#f5f5f5">Sandbox aislado, sin internet</text><text x="720" y="197" text-anchor="end" font-size="11.5" fill="#9e9e9e">nuevo en cada experimento</text><rect x="296" y="208" width="208" height="72" rx="8" fill="#0f0f0f" stroke="#3a3a3a" stroke-width="1.25"/><text x="400.0" y="232" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5">Herramientas</text><text x="400.0" y="250" text-anchor="middle" font-size="11.5" fill="#9e9e9e">Semgrep, gitleaks, OSV,</text><text x="400.0" y="266" text-anchor="middle" font-size="11.5" fill="#9e9e9e">Nuclei, ZAP, navegador</text><rect x="520" y="208" width="200" height="72" rx="8" fill="#0f0f0f" stroke="#3a3a3a" stroke-width="1.25"/><text x="620.0" y="232" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5">Objetivos</text><text x="620.0" y="250" text-anchor="middle" font-size="11.5" fill="#9e9e9e">solo apps del laboratorio</text><text x="620.0" y="266" text-anchor="middle" font-size="11.5" fill="#9e9e9e">y benchmarks públicos</text><rect x="24" y="328" width="200" height="72" rx="8" fill="#0f0f0f" stroke="#3a3a3a" stroke-width="1.25"/><text x="124.0" y="352" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5">Claves de respuesta</text><text x="124.0" y="370" text-anchor="middle" font-size="11.5" fill="#9e9e9e">escritas antes de correr,</text><text x="124.0" y="386" text-anchor="middle" font-size="11.5" fill="#9e9e9e">dos apps ocultas</text><rect x="280" y="328" width="200" height="72" rx="8" fill="#122032" stroke="#4c9fff" stroke-width="2"/><text x="380.0" y="352" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5">Registros de hallazgos</text><text x="380.0" y="370" text-anchor="middle" font-size="11.5" fill="#f5f5f5">CWE, ATT&amp;CK, evidencia</text><text x="380.0" y="386" text-anchor="middle" font-size="11.5" fill="#f5f5f5">y una prueba segura</text><rect x="536" y="328" width="200" height="72" rx="8" fill="#0f0f0f" stroke="#3a3a3a" stroke-width="1.25"/><text x="636.0" y="352" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5">Puntaje y revisión</text><text x="636.0" y="370" text-anchor="middle" font-size="11.5" fill="#9e9e9e">clave, luego otro proveedor</text><text x="636.0" y="386" text-anchor="middle" font-size="11.5" fill="#9e9e9e">y al final una persona</text><text x="388" y="164" font-size="11.5" fill="#9e9e9e">llamadas</text><text x="388" y="316" font-size="11.5" fill="#9e9e9e">evidencia</text></svg>