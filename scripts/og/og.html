<!doctype html>
<!--
  Source for public/og.png (1200x630) and the PNG icons. Regenerate with:
    npm run og
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: 'Inter';
        src: url('../../node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2') format('woff2');
        font-weight: 100 900;
      }
      @font-face {
        font-family: 'Space Grotesk';
        src: url('../../node_modules/@fontsource-variable/space-grotesk/files/space-grotesk-latin-wght-normal.woff2') format('woff2');
        font-weight: 300 700;
      }
      html, body { margin: 0; }
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #0e5c63;
        color: #fff;
        font-family: 'Inter', sans-serif;
        position: relative;
      }
      .inner {
        position: absolute;
        inset: 0;
        padding: 88px 96px;
        display: flex;
        flex-direction: column;
      }
      .rule { width: 96px; height: 6px; background: #dceaea; margin-bottom: 44px; }
      h1 {
        font-family: 'Space Grotesk', sans-serif;
        font-weight: 700;
        font-size: 104px;
        line-height: 1;
        letter-spacing: -0.02em;
        margin: 0;
      }
      .role {
        margin: 28px 0 0;
        font-size: 44px;
        font-weight: 600;
        color: #dceaea;
      }
      .markets {
        margin-top: auto;
        display: flex;
        gap: 16px;
        font-family: 'Space Grotesk', sans-serif;
        font-weight: 600;
        font-size: 28px;
      }
      .markets span {
        padding: 10px 22px;
        border: 2px solid rgba(255, 255, 255, 0.45);
        border-radius: 6px;
      }
      .url {
        position: absolute;
        right: 96px;
        bottom: 98px;
        font-size: 26px;
        color: #bfd4d4;
      }
      .band {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 18px;
        background: #0a4a50;
      }
    </style>
  </head>
  <body>
    <div class="inner">
      <div class="rule"></div>
      <h1>Andrés Cortés</h1>
      <p class="role">Virtual CISO · Fintech &amp; Crypto · LatAm</p>
      <div class="markets"><span>Argentina</span><span>Mexico</span><span>Brazil</span></div>
    </div>
    <div class="url">andresxcortes.github.io</div>
    <div class="band"></div>
  </body>
</html>
